name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: pse-wtag/java-ci-cd-template/.github/workflows/master-dotnet-pipeline.yml@main
    with:
      dotnet-version: 10.0.x
      solution-path: Service.slnx
      configuration: Release
    secrets: inherit
